# ================================================================
# Great Expectations Configuration (GX 1.x)
# ================================================================
# Data quality validation for raw CSV files before ETL ingestion.
#
# Usage:
#   python great_expectations/validate_sources.py
#
# This runs as a pre-ETL gate — if any suite fails, the pipeline
# should halt before loading invalid data into the warehouse.
#
# Note: validate_sources.py uses an EphemeralDataContext, so this
# file serves as documentation only. The runtime context is created
# programmatically in the validation script.
# ================================================================

config_version: 4.0

fluent_datasources:
  csv_source:
    type: pandas

expectations_store_name: expectations_store
validations_store_name: validations_store

stores:
  expectations_store:
    class_name: ExpectationsStore
    store_backend:
      class_name: TupleFilesystemStoreBackend
      base_directory: expectations/

  validations_store:
    class_name: ValidationsStore
    store_backend:
      class_name: TupleFilesystemStoreBackend
      base_directory: uncommitted/validations/
